name = "edu-live-worker"
main = "src/index.ts"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "edu-live-chunks"
remote = true

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "edu-live-pdfs"

[[d1_databases]]
binding = "EDU_LIVE_DB"
database_name = "edu-live-db"
database_id = "84db96aa-c71e-4f39-bf14-3ae05faa9f2f"

[vars]
GUARDRAIL_ENABLED = "true"
JEV_ENABLED = "true"
